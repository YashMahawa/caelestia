# ######## Window rules ########
windowrulev2 = opacity $windowOpacity override, fullscreen:0

windowrulev2 = opaque, class:^(foot|equibop|org\.quickshell|imv|swappy)$
windowrulev2 = center, floating:1, xwayland:0

# Float utilities
windowrulev2 = float, class:^(guifetch|yad|zenity|wev|org\.gnome\.FileRoller|file-roller|blueman-manager|com\.github\.GradienceTeam\.Gradience|feh|imv|system-config-printer|org\.quickshell)$

# Authentication prompts
windowrulev2 = float, class:^(.*polkit.*|.*policykit.*|pinentry.*|gcr-prompter|org\.gnome\.keyring\.SystemPrompter)$
windowrulev2 = center, class:^(.*polkit.*|.*policykit.*|pinentry.*|gcr-prompter|org\.gnome\.keyring\.SystemPrompter)$
windowrulev2 = float, title:^(Authentication Required|Unlock Keyring|PolicyKit1 Daemon)$
windowrulev2 = center, title:^(Authentication Required|Unlock Keyring|PolicyKit1 Daemon)$

# Network controls
windowrulev2 = float, class:^(nm-connection-editor|nm-applet|blueman-manager|blueman-services|blueman-sendto|wihotspot-gui)$
windowrulev2 = center, class:^(nm-connection-editor|nm-applet|blueman-manager|blueman-services|blueman-sendto|wihotspot-gui)$
windowrulev2 = float, class:^(foot)$, title:^(nmtui)$
windowrulev2 = size 60% 70%, class:^(foot)$, title:^(nmtui)$
windowrulev2 = center, class:^(foot)$, title:^(nmtui)$

# GNOME Settings & Audio management
windowrulev2 = float, class:^(org\.gnome\.Settings)$
windowrulev2 = size 70% 80%, class:^(org\.gnome\.Settings)$
windowrulev2 = center, class:^(org\.gnome\.Settings)$
windowrulev2 = float, class:^(org\.pulseaudio\.pavucontrol|pavucontrol|pwvucontrol|helvum|easyeffects|qpwgraph|yad-icon-browser)$
windowrulev2 = size 60% 70%, class:^(org\.pulseaudio\.pavucontrol|pavucontrol|pwvucontrol|helvum|easyeffects|qpwgraph|yad-icon-browser)$
windowrulev2 = center, class:^(org\.pulseaudio\.pavucontrol|pavucontrol|pwvucontrol|helvum|easyeffects|qpwgraph|yad-icon-browser)$

# Settings and appearance
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = size 50% 60%, class:^(nwg-look)$
windowrulev2 = center, class:^(nwg-look)$

# Special workspaces
windowrulev2 = workspace special:sysmon, class:^(btop)$
windowrulev2 = workspace special:music, class:^(feishin|Spotify|Supersonic|Cider|com\.github\.th-ch\.youtube-music|Plexamp|com-maxrave-simpmusic-MainKt)$
windowrulev2 = workspace special:music, initialTitle:^(Spotify|Spotify Free)$
windowrulev2 = workspace special:communication, class:^(discord|equibop|vesktop|whatsapp)$
windowrulev2 = workspace special:todo, class:^(Todoist)$

# Dialogs, file pickers, and desktop portals
windowrulev2 = float, class:^(org\.freedesktop\.impl\.portal\.desktop\..*)$
windowrulev2 = center, class:^(org\.freedesktop\.impl\.portal\.desktop\..*)$
windowrulev2 = size 70% 70%, class:^(org\.freedesktop\.impl\.portal\.desktop\..*)$
windowrulev2 = float, title:^(Select|Open|Save)( a)? (File|Folder|Directory)(s)?$
windowrulev2 = center, title:^(Select|Open|Save)( a)? (File|Folder|Directory)(s)?$
windowrulev2 = float, title:^(File|Folder) (Operation|Upload|Properties)( Progress)?$
windowrulev2 = float, title:^(.* Properties)$
windowrulev2 = float, title:^(Export Image as PNG)$
windowrulev2 = float, title:^(GIMP Crash Debug)$
windowrulev2 = float, title:^(Save As)$
windowrulev2 = float, title:^(Library)$

# Creative software
windowrulev2 = opaque, class:^(krita|gimp|inkscape|darktable|resolve|kdenlive|shotcut|blender|godot)$

# Ueberzugpp
windowrulev2 = float, class:^(ueberzugpp_.*)$
windowrulev2 = noinitialfocus, class:^(ueberzugpp_.*)$

# Steam & Games
windowrulev2 = rounding 10, class:^(steam)$
windowrulev2 = float, class:^(steam)$, title:^(Friends List)$
windowrulev2 = opaque, class:^(steam_app_(default|[0-9]+)|gamescope)$
windowrulev2 = immediate, class:^(steam_app_(default|[0-9]+)|gamescope)$
windowrulev2 = idleinhibit always, class:^(steam_app_(default|[0-9]+)|gamescope)$

# Minecraft launcher consoles
windowrulev2 = float, class:^(com-atlauncher-App)$, title:^(ATLauncher Console)$
windowrulev2 = float, class:^(PandoraLauncher)$, title:^(Minecraft Game Output)$

# Autodesk Fusion 360
windowrulev2 = noblur, class:^(fusion360\.exe)$, title:^(Fusion360|(Marking Menu))$

# XWayland popups
windowrulev2 = nodim, xwayland:1, title:^(win[0-9]+)$
windowrulev2 = noshadow, xwayland:1, title:^(win[0-9]+)$
windowrulev2 = rounding 10, xwayland:1, title:^(win[0-9]+)$


# ######## Workspace rules ########
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut


# ######## Layer rules ########
layerrule = animation fade, hyprpicker
layerrule = animation fade, logout_dialog
layerrule = animation fade, selection
layerrule = animation fade, wayfreeze
layerrule = animation popin 80%, launcher
layerrule = blur, launcher
layerrule = noanim, caelestia-(border-exclusion|area-picker)
layerrule = noanim, caelestia-immersive-lyrics
layerrule = animation fade, caelestia-(drawers|background)
layerrule = blur, caelestia-drawers
layerrule = ignorealpha 0.82, caelestia-drawers
layerrule = blur, caelestia-background
layerrule = ignorealpha 0.25, caelestia-background
