# ######## Window rules ########
windowrule = opacity $windowOpacity override, match:fullscreen false

windowrule = opaque true, match:class ^(foot|equibop|org\.quickshell|imv|swappy)$
windowrule = center true, match:float true, match:xwayland false

# Float utilities
windowrule = float true, match:class ^(guifetch|yad|zenity|wev|org\.gnome\.FileRoller|file-roller|blueman-manager|com\.github\.GradienceTeam\.Gradience|feh|imv|system-config-printer|org\.quickshell)$

# Authentication prompts
windowrule = float true, match:class ^(.*polkit.*|.*policykit.*|pinentry.*|gcr-prompter|org\.gnome\.keyring\.SystemPrompter)$
windowrule = center true, match:class ^(.*polkit.*|.*policykit.*|pinentry.*|gcr-prompter|org\.gnome\.keyring\.SystemPrompter)$
windowrule = float true, match:title ^(Authentication Required|Unlock Keyring|PolicyKit1 Daemon)$
windowrule = center true, match:title ^(Authentication Required|Unlock Keyring|PolicyKit1 Daemon)$

# Network controls
windowrule = float true, match:class ^(nm-connection-editor|nm-applet|blueman-manager|blueman-services|blueman-sendto|wihotspot-gui)$
windowrule = center true, match:class ^(nm-connection-editor|nm-applet|blueman-manager|blueman-services|blueman-sendto|wihotspot-gui)$
windowrule = float true, match:class ^(foot)$, match:title ^(nmtui)$
windowrule = size 60% 70%, match:class ^(foot)$, match:title ^(nmtui)$
windowrule = center true, match:class ^(foot)$, match:title ^(nmtui)$

# GNOME Settings & Audio management
windowrule = float true, match:class ^(org\.gnome\.Settings)$
windowrule = size 70% 80%, match:class ^(org\.gnome\.Settings)$
windowrule = center true, match:class ^(org\.gnome\.Settings)$
windowrule = float true, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|pwvucontrol|helvum|easyeffects|qpwgraph|yad-icon-browser)$
windowrule = size 60% 70%, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|pwvucontrol|helvum|easyeffects|qpwgraph|yad-icon-browser)$
windowrule = center true, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|pwvucontrol|helvum|easyeffects|qpwgraph|yad-icon-browser)$

# Settings and appearance
windowrule = float true, match:class ^(nwg-look)$
windowrule = size 50% 60%, match:class ^(nwg-look)$
windowrule = center true, match:class ^(nwg-look)$

# Special workspaces
windowrule = workspace special:sysmon, match:class ^(btop)$
windowrule = workspace special:music, match:class ^(feishin|Spotify|Supersonic|Cider|com\.github\.th-ch\.youtube-music|Plexamp|com-maxrave-simpmusic-MainKt)$
windowrule = workspace special:music, match:initial_title ^(Spotify|Spotify Free)$
windowrule = workspace special:communication, match:class ^(discord|equibop|vesktop|whatsapp)$
windowrule = workspace special:todo, match:class ^(Todoist)$

# Dialogs, file pickers, and desktop portals
windowrule = float true, match:class ^(org\.freedesktop\.impl\.portal\.desktop\..*)$
windowrule = center true, match:class ^(org\.freedesktop\.impl\.portal\.desktop\..*)$
windowrule = size 70% 70%, match:class ^(org\.freedesktop\.impl\.portal\.desktop\..*)$
windowrule = float true, match:title ^(Select|Open|Save)( a)? (File|Folder|Directory)(s)?$
windowrule = center true, match:title ^(Select|Open|Save)( a)? (File|Folder|Directory)(s)?$
windowrule = float true, match:title ^(File|Folder) (Operation|Upload|Properties)( Progress)?$
windowrule = float true, match:title ^(.* Properties)$
windowrule = float true, match:title ^(Export Image as PNG)$
windowrule = float true, match:title ^(GIMP Crash Debug)$
windowrule = float true, match:title ^(Save As)$
windowrule = float true, match:title ^(Library)$

# Creative software
windowrule = opaque true, match:class ^(krita|gimp|inkscape|darktable|resolve|kdenlive|shotcut|blender|godot)$

# Ueberzugpp
windowrule = float true, match:class ^(ueberzugpp_.*)$
windowrule = no_initial_focus true, match:class ^(ueberzugpp_.*)$

# Steam & Games
windowrule = rounding 10, match:class ^(steam)$
windowrule = float true, match:class ^(steam)$, match:title ^(Friends List)$
windowrule = opaque true, match:class ^(steam_app_(default|[0-9]+)|gamescope)$
windowrule = immediate true, match:class ^(steam_app_(default|[0-9]+)|gamescope)$
windowrule = idle_inhibit always, match:class ^(steam_app_(default|[0-9]+)|gamescope)$

# Minecraft launcher consoles
windowrule = float true, match:class ^(com-atlauncher-App)$, match:title ^(ATLauncher Console)$
windowrule = float true, match:class ^(PandoraLauncher)$, match:title ^(Minecraft Game Output)$

# Autodesk Fusion 360
windowrule = no_blur true, match:class ^(fusion360\.exe)$, match:title ^(Fusion360|(Marking Menu))$

# XWayland popups
windowrule = no_dim true, match:xwayland 1, match:title ^(win[0-9]+)$
windowrule = no_shadow true, match:xwayland 1, match:title ^(win[0-9]+)$
windowrule = rounding 10, match:xwayland 1, match:title ^(win[0-9]+)$


# ######## Workspace rules ########
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut


# ######## Layer rules ########
layerrule = animation fade, match:namespace ^(hyprpicker)$
layerrule = animation fade, match:namespace ^(logout_dialog)$
layerrule = animation fade, match:namespace ^(selection)$
layerrule = animation fade, match:namespace ^(wayfreeze)$
layerrule = animation popin 80%, match:namespace ^(launcher)$
layerrule = blur true, match:namespace ^(launcher)$
layerrule = no_anim true, match:namespace ^(caelestia-(border-exclusion|area-picker)|caelestia-immersive-lyrics)$
layerrule = animation fade, match:namespace ^(caelestia-(drawers|background))$
layerrule = blur true, match:namespace ^(caelestia-drawers)$
layerrule = ignore_alpha 0.82, match:namespace ^(caelestia-drawers)$
layerrule = blur true, match:namespace ^(caelestia-background)$
layerrule = ignore_alpha 0.25, match:namespace ^(caelestia-background)$
