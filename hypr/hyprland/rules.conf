# ######## Window rules ########
windowrule = opacity $windowOpacity override, match:fullscreen false

windowrule = opaque true, match:class foot|equibop|org\.quickshell|imv|swappy  # They use native transparency or we want them opaque
windowrule = center true, match:float true, match:xwayland false  # Center all floating windows (not xwayland cause popups)

# Codex realtime voice is a compact interactive surface managed by Caelestia.
windowrule = float true, match:title ^Codex Voice$
windowrule = pin true, match:title ^Codex Voice$
windowrule = no_blur true, match:title ^Codex Voice$
windowrule = no_shadow true, match:title ^Codex Voice$
windowrule = border_size 0, match:title ^Codex Voice$
windowrule = no_dim true, match:title ^Codex Voice$
windowrule = opacity 1 override, match:title ^Codex Voice$

# Float
windowrule = float true, match:class guifetch  # FlafyDev/guifetch
windowrule = float true, match:class yad
windowrule = float true, match:class zenity
windowrule = float true, match:class wev
windowrule = float true, match:class org\.gnome\.FileRoller
windowrule = float true, match:class file-roller  # WHY IS THERE TWOOOOOOOOOOOOOOOO
windowrule = float true, match:class blueman-manager
windowrule = float true, match:class com\.github\.GradienceTeam\.Gradience
windowrule = float true, match:class feh
windowrule = float true, match:class imv
windowrule = float true, match:class system-config-printer
windowrule = float true, match:class org\.quickshell

# Float, resize and center
windowrule = float true, match:class foot, match:title nmtui
windowrule = size 60% 70%, match:class foot, match:title nmtui
windowrule = center 1, match:class foot, match:title nmtui
windowrule = float true, match:class org\.gnome\.Settings
windowrule = size 70% 80%, match:class org\.gnome\.Settings
windowrule = center 1, match:class org\.gnome\.Settings
windowrule = float true, match:class org\.pulseaudio\.pavucontrol|com\.saivert\.pwvucontrol|yad-icon-browser
windowrule = size 60% 70%, match:class org\.pulseaudio\.pavucontrol|com\.saivert\.pwvucontrol|yad-icon-browser
windowrule = center 1, match:class org\.pulseaudio\.pavucontrol|com\.saivert\.pwvucontrol|yad-icon-browser
windowrule = float true, match:class nwg-look
windowrule = size 50% 60%, match:class nwg-look
windowrule = center 1, match:class nwg-look

# Special workspaces
windowrule = workspace special:sysmon, match:class btop
windowrule = workspace special:music, match:class feishin|Spotify|Supersonic|com.github.th-ch.youtube-music|Plexamp|com-maxrave-simpmusic-MainKt
windowrule = workspace special:music, match:initial_title ^(Spotify|Spotify Free)$  # Spotify wayland, it has no class for some reason
windowrule = workspace special:communication, match:class discord|equibop|vesktop|whatsapp
windowrule = workspace special:todo, match:class Todoist

# Dialogs
windowrule = float true, match:title (Select|Open)( a)? (File|Folder)(s)?
# File choosers are sized relative to the monitor they open on, so a size
# GTK remembered from a larger display can never overflow a smaller one.
windowrule = float true, match:class xdg-desktop-portal-gtk
windowrule = size 62% 74%, match:class xdg-desktop-portal-gtk
windowrule = center 1, match:class xdg-desktop-portal-gtk
windowrule = size 62% 74%, match:title ^(Select|Open|Save)( a)? (File|Folder)(s)?$
windowrule = center 1, match:title ^(Select|Open|Save)( a)? (File|Folder)(s)?$
windowrule = float true, match:title File (Operation|Upload)( Progress)?
windowrule = float true, match:title .* Properties
windowrule = float true, match:title Rename ".*"
windowrule = float true, match:title Export Image as PNG
windowrule = float true, match:title GIMP Crash Debug
windowrule = float true, match:title Save As
windowrule = float true, match:title Library

# Picture-in-picture is left to normal window management.
# windowrule = float true, match:title Picture(-| )in(-| )[Pp]icture

# Creative software
windowrule = opaque true, match:class krita|gimp|inkscape|darktable|resolve|kdenlive|shotcut|blender|godot

# Ueberzugpp
windowrule = float true, match:class ^(ueberzugpp_.*)$
windowrule = no_initial_focus true, match:class ^(ueberzugpp_.*)$

# Steam
windowrule = rounding 10, match:class steam
windowrule = float true, match:title Friends List, match:class steam

# Games (Steam, Lutris/Wine, Gamescope)
windowrule = opaque true, match:class (steam_app_(default|[0-9]+))|gamescope
windowrule = immediate true, match:class (steam_app_(default|[0-9]+))|gamescope  # Allow tearing for games
windowrule = idle_inhibit always, match:class (steam_app_(default|[0-9]+))|gamescope  # Always idle inhibit when playing a game
windowrule = idle_inhibit always, match:class ^(mpv|vlc)$  # Keep video playback from triggering DPMS

# Minecraft launcher consoles
windowrule = float true, match:class com-atlauncher-App, match:title ATLauncher Console
windowrule = float true, match:class PandoraLauncher, match:title Minecraft Game Output

# Autodesk Fusion 360
windowrule = no_blur true, match:title Fusion360|(Marking Menu), match:class fusion360\.exe

# Ugh xwayland popups
windowrule = no_dim true, match:xwayland 1, match:title win[0-9]+
windowrule = no_shadow true, match:xwayland 1, match:title win[0-9]+
windowrule = rounding 10, match:xwayland 1, match:title win[0-9]+


# ######## Workspace rules ########
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut

# ######## Layer rules ########
layerrule = animation fade, match:namespace hyprpicker  # Colour picker out animation
layerrule = animation fade, match:namespace logout_dialog  # wlogout
layerrule = animation fade, match:namespace selection  # slurp
layerrule = animation fade, match:namespace wayfreeze

# Fuzzel
layerrule = animation popin 80%, match:namespace launcher
layerrule = blur true, match:namespace launcher

# Shell
layerrule = no_anim true, match:namespace caelestia-(border-exclusion|area-picker)
layerrule = no_anim true, match:namespace caelestia-immersive-lyrics
layerrule = animation fade, match:namespace caelestia-(drawers|background)
# Keep translucency material-like after login and display hotplug. Caelestia
# also refreshes the drawer threshold when its theme changes, but these rules
# provide the stable boot-time baseline.
layerrule = blur true, match:namespace caelestia-drawers
layerrule = ignore_alpha 0.82, match:namespace caelestia-drawers
# The wallpaper surface is explicitly opaque. Blurring behind it cannot alter
# the image, but it forces needless full-output compositor work on each screen.

# Noctalia v5 comparison shell
windowrule = float true, match:class dev\.noctalia\.Noctalia
windowrule = size 1080 920, match:class dev\.noctalia\.Noctalia
layerrule = no_anim true, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = blur true, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = blur_popups true, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = ignore_alpha 0.5, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$

# Caelestia 2.0 native settings and material surfaces
windowrule = float true, match:class dev\.caelestia\.Native
windowrule = size 1536 950, match:class dev\.caelestia\.Native
windowrule = center true, match:class dev\.caelestia\.Native
layerrule = no_anim true, match:namespace ^caelestia-native-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = blur true, match:namespace ^caelestia-native-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = blur_popups true, match:namespace ^caelestia-native-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = ignore_alpha 0.5, match:namespace ^caelestia-native-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$

# Voice typing island
layerrule = animation popin 88%, match:namespace caelestia-voice-typing
layerrule = blur true, match:namespace caelestia-voice-typing
layerrule = ignore_alpha 0.18, match:namespace caelestia-voice-typing
