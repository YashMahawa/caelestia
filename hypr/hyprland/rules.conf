# ######## Window rules ########
windowrule rule_opacity {
    match {
        fullscreen = false
    }
    opacity = $windowOpacity override
}

windowrule rule_opaque_apps {
    match {
        class = ^(foot|equibop|org\.quickshell|imv|swappy)$
    }
    opaque = true
}

windowrule rule_center_floating {
    match {
        floating = true
        xwayland = false
    }
    center = true
}

# Float utilities
windowrule rule_float_utilities {
    match {
        class = ^(guifetch|yad|zenity|wev|org\.gnome\.FileRoller|file-roller|blueman-manager|com\.github\.GradienceTeam\.Gradience|feh|imv|system-config-printer|org\.quickshell)$
    }
    float = true
}

# Authentication prompts
windowrule rule_auth_prompts {
    match {
        class = ^(.*polkit.*|.*policykit.*|pinentry.*|gcr-prompter|org\.gnome\.keyring\.SystemPrompter)$
    }
    float = true
    center = true
}

windowrule rule_auth_titles {
    match {
        title = ^(Authentication Required|Unlock Keyring|PolicyKit1 Daemon)$
    }
    float = true
    center = true
}

# Network controls
windowrule rule_net_controls {
    match {
        class = ^(nm-connection-editor|nm-applet|blueman-manager|blueman-services|blueman-sendto|wihotspot-gui)$
    }
    float = true
    center = true
}

windowrule rule_nmtui {
    match {
        class = ^(foot)$
        title = ^(nmtui)$
    }
    float = true
    size = 60% 70%
    center = true
}

windowrule rule_gnome_settings {
    match {
        class = ^(org\.gnome\.Settings)$
    }
    float = true
    size = 70% 80%
    center = true
}

# Audio management popups
windowrule rule_audio_popups {
    match {
        class = ^(org\.pulseaudio\.pavucontrol|pavucontrol|pwvucontrol|helvum|easyeffects|qpwgraph|yad-icon-browser)$
    }
    float = true
    size = 60% 70%
    center = true
}

# Settings and appearance
windowrule rule_nwg_look {
    match {
        class = ^(nwg-look)$
    }
    float = true
    size = 50% 60%
    center = true
}

# Special workspaces
windowrule rule_special_sysmon {
    match {
        class = ^(btop)$
    }
    workspace = special:sysmon
}

windowrule rule_special_music {
    match {
        class = ^(feishin|Spotify|Supersonic|Cider|com\.github\.th-ch\.youtube-music|Plexamp|com-maxrave-simpmusic-MainKt)$
    }
    workspace = special:music
}

windowrule rule_special_music_spotify {
    match {
        initialTitle = ^(Spotify|Spotify Free)$
    }
    workspace = special:music
}

windowrule rule_special_communication {
    match {
        class = ^(discord|equibop|vesktop|whatsapp)$
    }
    workspace = special:communication
}

windowrule rule_special_todo {
    match {
        class = ^(Todoist)$
    }
    workspace = special:todo
}

# Dialogs, file pickers, and desktop portals
windowrule rule_desktop_portals {
    match {
        class = ^(org\.freedesktop\.impl\.portal\.desktop\..*)$
    }
    float = true
    center = true
    size = 70% 70%
}

windowrule rule_dialog_pickers {
    match {
        title = ^(Select|Open|Save)( a)? (File|Folder|Directory)(s)?$
    }
    float = true
    center = true
}

windowrule rule_file_operations {
    match {
        title = ^(File|Folder) (Operation|Upload|Properties)( Progress)?$
    }
    float = true
}

windowrule rule_dialog_properties {
    match {
        title = ^(.* Properties)$
    }
    float = true
}

windowrule rule_export_png {
    match {
        title = ^(Export Image as PNG)$
    }
    float = true
}

windowrule rule_gimp_crash {
    match {
        title = ^(GIMP Crash Debug)$
    }
    float = true
}

windowrule rule_save_as {
    match {
        title = ^(Save As)$
    }
    float = true
}

windowrule rule_library {
    match {
        title = ^(Library)$
    }
    float = true
}

# Creative software
windowrule rule_creative_opaque {
    match {
        class = ^(krita|gimp|inkscape|darktable|resolve|kdenlive|shotcut|blender|godot)$
    }
    opaque = true
}

# Ueberzugpp
windowrule rule_ueberzugpp {
    match {
        class = ^(ueberzugpp_.*)$
    }
    float = true
    noinitialfocus = true
}

# Steam
windowrule rule_steam_rounding {
    match {
        class = ^(steam)$
    }
    rounding = 10
}

windowrule rule_steam_friends {
    match {
        class = ^(steam)$
        title = ^(Friends List)$
    }
    float = true
}

# Games (Steam, Lutris/Wine, Gamescope)
windowrule rule_games {
    match {
        class = ^(steam_app_(default|[0-9]+)|gamescope)$
    }
    opaque = true
    immediate = true
    idleinhibit = always
}

# Minecraft launcher consoles
windowrule rule_atlauncher {
    match {
        class = ^(com-atlauncher-App)$
        title = ^(ATLauncher Console)$
    }
    float = true
}

windowrule rule_pandora {
    match {
        class = ^(PandoraLauncher)$
        title = ^(Minecraft Game Output)$
    }
    float = true
}

# Autodesk Fusion 360
windowrule rule_fusion360 {
    match {
        class = ^(fusion360\.exe)$
        title = ^(Fusion360|(Marking Menu))$
    }
    noblur = true
}

# Ugh xwayland popups
windowrule rule_xwayland_popups {
    match {
        xwayland = true
        title = ^(win[0-9]+)$
    }
    nodim = true
    noshadow = true
    rounding = 10
}


# ######## Workspace rules ########
workspace rule_gaps_single {
    match {
        workspace = w[tv1]s[false]
    }
    gapsout = $singleWindowGapsOut
}

workspace rule_gaps_fullscreen {
    match {
        workspace = f[1]s[false]
    }
    gapsout = $singleWindowGapsOut
}


# ######## Layer rules ########
layerrule rule_picker_anim {
    match {
        namespace = ^(hyprpicker)$
    }
    animation = fade
}

layerrule rule_logout_dialog {
    match {
        namespace = ^(logout_dialog)$
    }
    animation = fade
}

layerrule rule_selection {
    match {
        namespace = ^(selection)$
    }
    animation = fade
}

layerrule rule_wayfreeze {
    match {
        namespace = ^(wayfreeze)$
    }
    animation = fade
}

# Fuzzel
layerrule rule_fuzzel {
    match {
        namespace = ^(launcher)$
    }
    animation = popin 80%
    blur = true
}

# Shell
layerrule rule_shell_noanim {
    match {
        namespace = ^(caelestia-(border-exclusion|area-picker)|caelestia-immersive-lyrics)$
    }
    noanim = true
}

layerrule rule_shell_drawers_anim {
    match {
        namespace = ^(caelestia-(drawers|background))$
    }
    animation = fade
}

layerrule rule_shell_drawers {
    match {
        namespace = ^(caelestia-drawers)$
    }
    blur = true
    ignorealpha = 0.82
}

layerrule rule_shell_bg {
    match {
        namespace = ^(caelestia-background)$
    }
    blur = true
    ignorealpha = 0.25
}
